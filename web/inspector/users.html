<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guard DTR — Security Agency Management System</title>
<link rel="icon" type="image/png" href="../favicon.png">
<script src="../js/theme-preference.js" defer></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link href="css/inspector-theme.css" rel="stylesheet">
<style>
.location-none { color: #94a3b8; font-style: italic; font-size: 0.82rem; }
</style>
</head>
<body class="inspector-body" data-ix-page="users">

<div id="loadingScreen">
    <div class="spinner-border text-success"></div>
    <p>Loading guard records…</p>
</div>

<div class="ix-app">
    <header class="ix-shell">
        <div class="ix-shell-bar">
            <div class="ix-shell-brand">
                <span class="ix-brand-badge">Field audit</span>
                <div class="ix-shell-titles">
                    <p class="ix-shell-product">Security Agency Management System</p>
                    <p class="ix-shell-tagline">Read-only field review</p>
                </div>
            </div>
            <div class="ix-shell-actions">
                <span class="ix-readonly-pill">Audit mode</span>
                <span class="ix-user-chip" id="ixUserName">Inspector</span>
                <button type="button" class="ix-btn-logout" onclick="inspectorLogout()">Sign out</button>
            </div>
        </div>
        <nav class="ix-topnav" id="ixTopnav" aria-label="Inspector navigation">
            <button type="button" class="ix-menu-toggle" id="ixMenuToggle" aria-label="Menu">☰ Menu</button>
            <div class="ix-topnav-links">
                <a href="dashboard.html"><span class="ix-nav-icon">📊</span> Overview</a>
                <a href="users.html"><span class="ix-nav-icon">📋</span> Guard DTR</a>
                <a href="locations.html"><span class="ix-nav-icon">📍</span> Sites</a>
                <a href="incidents.html"><span class="ix-nav-icon">🚨</span> Alerts</a>
                <a href="swaps.html"><span class="ix-nav-icon">🔁</span> Shift requests</a>
            </div>
        </nav>
    </header>

    <div class="ix-main">
        <div class="ix-page-head">
            <p class="ix-breadcrumb">Records</p>
            <h1 class="ix-page-title">Guard DTR</h1>
        </div>
        <main class="ix-content">

            <div class="ix-section-label">Security guards</div>
            <div class="ix-panel">
              <div class="sl-table-frame">
                <table class="ix-table" id="guardTable">
                    <thead>
                        <tr>
                            <th>Guard</th>
                            <th>Status</th>
                            <th>Scheduled duty</th>
                            <th style="text-align:center;">DTR</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="4" class="empty-state">Loading…</td></tr>
                    </tbody>
                </table>
              </div>
            </div>
        </main>
    </div>
</div>

<div class="modal fade ix-modal" id="dtrModal" tabindex="-1">
<div class="modal-dialog modal-xl modal-dialog-centered">
<div class="modal-content">
<div class="modal-header">
    <h5 class="modal-title">Daily Time Record</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <p class="ix-meta">Guard: <strong id="dtrGuardName"></strong></p>
    <div id="dtrRecordsList" class="dtr-records-list">
        <div class="empty-state">Loading records…</div>
    </div>
    <button type="button" class="btn-pdf mt-3" onclick="generateDTR(this)">Download PDF</button>
</div>
</div>
</div>
</div>

<!-- Supabase compatibility facade -->
<script src="../js/auth-username.js"></script>
<script src="js/inspector-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="../js/supabase-firebase-bridge.js"></script>
<script src="../js/notification-center.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<script>
const auth = firebase.auth();
const db   = firebase.firestore();

let currentDTRData = [];
let currentDTRUid  = null;
let personnelAccounts = {};

function personnelDisplayName(account) {
    if (!account) return "Guard";
    return [(account.firstName || ""),
        (account.middleInitial ? account.middleInitial + ". " : ""),
        (account.lastName || "")].join(" ").trim()
        || account.name || displayLoginId(account) || "Guard";
}

// ── Auth guard ────────────────────────────────────────────────────────────────
auth.onAuthStateChanged(user => {
    if (!user) { window.location.href = "login.html"; return; }

    db.collection("users").doc(user.uid).get().then(doc => {
        if (!doc.exists) { window.location.href = "login.html"; return; }
        const role = doc.data().role;

        if (role === "admin") {
            window.location.href = "../admin/users.html";
            return;
        }
        if (role !== "inspector") {
            window.location.href = "login.html";
            return;
        }
        const d = doc.data();
        const name = [d.firstName, d.middleInitial ? d.middleInitial + "." : "", d.lastName]
            .filter(Boolean).join(" ") || d.name || displayLoginId(d);
        setInspectorUserName(name);
        loadGuards();
    }).catch(() => {
        window.location.href = "login.html";
    });
});

function scheduleDutyLabel(uid, schedulesByUser) {
    const now = new Date();
    const list = schedulesByUser[uid] || [];

    const active = list.find(s => {
        const start = s.startAt && s.startAt.toDate ? s.startAt.toDate() : null;
        const end = s.endAt && s.endAt.toDate ? s.endAt.toDate() : null;
        return start && end && now >= start && now <= end;
    });
    if (active) {
        const label = active.locationLabel || "Duty site";
        return `<span class="ix-chip">📍 ${escapeHtml(label)} (on duty)</span>`;
    }

    const upcoming = list
        .map(s => ({
            ...s,
            start: s.startAt && s.startAt.toDate ? s.startAt.toDate() : null,
        }))
        .filter(s => s.start && s.start > now)
        .sort((a, b) => a.start - b.start)[0];

    if (upcoming) {
        const label = upcoming.locationLabel || "—";
        return `<span class="location-none">Next: ${escapeHtml(label)}</span>`;
    }

    return `<span class="location-none">No schedule</span>`;
}

function loadGuards() {
    Promise.all([
        db.collection("users").where("role", "==", "user").get(),
        db.collection("schedules").get(),
    ]).then(([userSnap, schedSnap]) => {
        const schedulesByUser = {};
        schedSnap.forEach(doc => {
            const s = doc.data();
            const uid = s.userId;
            if (!uid) return;
            if (!schedulesByUser[uid]) schedulesByUser[uid] = [];
            schedulesByUser[uid].push(s);
        });

        let html = "";
        personnelAccounts = {};
        userSnap.forEach(doc => {
            const data = doc.data();
            personnelAccounts[doc.id] = data;
            const fullName = personnelDisplayName(data);

            const isActive = data.active !== false;
            const badgeHtml = isActive
                ? `<span class="ix-badge ix-badge-ok">Active</span>`
                : `<span class="ix-badge ix-badge-off">Disabled</span>`;

            const dutyHtml = scheduleDutyLabel(doc.id, schedulesByUser);

            html += `
            <tr>
                <td>
                    <div class="ix-cell-primary">${escapeHtml(fullName)}</div>
                    <div class="ix-cell-secondary">@${escapeHtml(displayLoginId(data))}</div>
                </td>
                <td>${badgeHtml}</td>
                <td>${dutyHtml}</td>
                <td style="text-align:center;">
                    <button type="button" class="ix-btn"
                        onclick="viewDTR('${doc.id}')">
                        View DTR
                    </button>
                </td>
            </tr>`;
        });

        if (!html) {
            html = `<tr><td colspan="4" style="text-align:center;padding:40px;color:#475569;">No security guards found.</td></tr>`;
        }

        document.getElementById("userTableBody").innerHTML = html;
        finishPageLoading();
    }).catch(error => {
        document.getElementById("userTableBody").innerHTML =
            `<tr><td colspan="4" style="text-align:center;color:#f87171;padding:32px;">Error: ${escapeHtml(error?.message || "Could not load personnel.")}</td></tr>`;
        finishPageLoading();
    });
}

function escapeHtml(text) {
    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDate(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("en-PH", { year: "numeric", month: "short", day: "numeric" });
}

// DTRs are shift sessions. This keeps a duty that crosses midnight in one
// record and shows the scheduled shift alongside the actual attendance.
function dtrSessionMinutes(session) {
    if (!session?.clock_in_at || !session?.clock_out_at) return 0;
    const milliseconds = new Date(session.clock_out_at) - new Date(session.clock_in_at);
    return milliseconds > 0 ? Math.floor(milliseconds / 60000) : 0;
}

function formatDtrTime(value) {
    if (!value) return '—';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '—' : date.toLocaleTimeString('en-PH', {
        hour: 'numeric', minute: '2-digit', hour12: true
    });
}

function formatDtrMinutes(minutes) {
    const safeMinutes = Math.max(0, Number(minutes) || 0);
    const hours = Math.floor(safeMinutes / 60);
    const remainder = safeMinutes % 60;
    if (!hours) return `${remainder} min`;
    if (!remainder) return hours === 1 ? '1 hr' : `${hours} hrs`;
    return `${hours}h ${remainder}m`;
}

function sessionDetailHtml(label, time, latitude, longitude, locationLabel) {
    if (!time) return `<div class="dtr-punch-block"><div class="dtr-punch-label">${label}</div><div class="dtr-punch-empty">Not recorded</div></div>`;
    const hasCoordinates = Number.isFinite(Number(latitude)) && Number.isFinite(Number(longitude));
    return `<div class="dtr-punch-block"><div class="dtr-punch-label">${label}</div><div class="dtr-punch-time">${formatDtrTime(time)}</div>${locationLabel ? `<div class="dtr-punch-meta">📍 ${escapeHtml(locationLabel)}</div>` : ''}${hasCoordinates ? `<div class="dtr-punch-meta">GPS: ${Number(latitude).toFixed(5)}, ${Number(longitude).toFixed(5)}</div>` : ''}</div>`;
}

function renderDtrSessionCard(session) {
    const workedMinutes = dtrSessionMinutes(session);
    const status = session.clock_out_at ? 'Completed' : 'Open — Time Out required';
    const statusColor = session.clock_out_at ? '#16a34a' : '#d97706';
    return `<div class="dtr-day-card">
        <div class="dtr-day-header">
            <span class="dtr-day-date">${escapeHtml(formatDate(session.duty_date))}</span>
            <div style="text-align:right"><span class="hours-badge" style="color:${statusColor};border-color:${statusColor}40;background:${statusColor}20">${escapeHtml(status)}</span><div style="font-size:.75rem;color:#64748b;margin-top:4px">Worked: ${formatDtrMinutes(workedMinutes)}</div></div>
        </div>
        <div class="dtr-punch-meta" style="margin:8px 0">Scheduled: ${formatDtrTime(session.scheduled_start_at)} – ${formatDtrTime(session.scheduled_end_at)}</div>
        <div class="dtr-punch-grid">
            ${sessionDetailHtml('Time In', session.clock_in_at, session.clock_in_latitude, session.clock_in_longitude, session.location_label)}
            ${sessionDetailHtml('Time Out', session.clock_out_at, session.clock_out_latitude, session.clock_out_longitude, session.location_label)}
        </div>
    </div>`;
}

async function viewDTR(uid) {
    currentDTRUid = uid;
    currentDTRData = [];
    document.getElementById('dtrGuardName').textContent = personnelDisplayName(personnelAccounts[uid]);
    const listEl = document.getElementById('dtrRecordsList');
    listEl.innerHTML = '<div class="empty-state"><div class="spinner-border spinner-border-sm text-success"></div> Loading duty sessions…</div>';
    new bootstrap.Modal(document.getElementById('dtrModal')).show();

    const { data, error } = await appSupabase.from('attendance_sessions').select()
        .eq('user_id', uid).order('scheduled_start_at', { ascending: false });
    if (error) {
        listEl.innerHTML = `<div style="text-align:center;color:#f87171;padding:24px">Error: ${escapeHtml(error.message || 'Could not load duty sessions.')}</div>`;
        return;
    }
    currentDTRData = data || [];
    listEl.innerHTML = currentDTRData.length
        ? currentDTRData.map(renderDtrSessionCard).join('')
        : '<div style="text-align:center;padding:32px;color:#475569">No duty sessions recorded yet.</div>';
}

function buildDtrPdfSummary(sessions) {
    const dates = sessions.map(session => session.duty_date).filter(Boolean).sort();
    const totalMinutes = sessions.reduce((total, session) => total + dtrSessionMinutes(session), 0);
    const completedDays = sessions.filter(session => session.clock_out_at).length;
    return {
        totalMinutes,
        completedDays,
        totalDays: sessions.length,
        periodLabel: dates.length === 0 ? '—' : dates.length === 1 ? formatDate(dates[0]) : `${formatDate(dates[0])} – ${formatDate(dates[dates.length - 1])}`,
    };
}

async function generateDTR(button) {
    if (currentDTRData.length === 0) {
        appDialog.toast('No duty sessions available to export.', { tone: 'warning' });
        return;
    }
    await appDialog.runBusy(button, async () => {
        await new Promise(resolve => requestAnimationFrame(resolve));
        const account = personnelAccounts[currentDTRUid] || {};
        const firstName = account.firstName || '';
        const middleInitial = account.middleInitial || '';
        const lastName = account.lastName || '';
        const summary = buildDtrPdfSummary(currentDTRData);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const tableData = currentDTRData.map(session => [
            session.duty_date || '',
            `${formatDtrTime(session.scheduled_start_at)} – ${formatDtrTime(session.scheduled_end_at)}`,
            formatDtrTime(session.clock_in_at),
            formatDtrTime(session.clock_out_at),
            formatDtrMinutes(dtrSessionMinutes(session)),
        ]);
        doc.setFontSize(16);
        doc.text('Daily Time Record', 14, 20);
        doc.setFontSize(12);
        doc.text(`Name: ${firstName} ${middleInitial ? `${middleInitial}.` : ''} ${lastName}`.trim(), 14, 30);
        doc.text(`Generated on: ${new Date().toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' })}`, 14, 38);
        doc.text(`Report period: ${summary.periodLabel}`, 14, 46);
        doc.text(`Completed duty sessions: ${summary.completedDays}/${summary.totalDays}`, 14, 54);
        doc.text(`Total hours worked: ${formatDtrMinutes(summary.totalMinutes)}`, 14, 62);
        doc.autoTable({ startY: 72, head: [['Duty date', 'Scheduled shift', 'Time In', 'Time Out', 'Hours worked']], body: tableData });
        doc.save(`DTR_${`${firstName}_${lastName}`.replace(/[^a-z0-9_-]/gi, '_') || 'personnel'}.pdf`);
    }, { label: 'Preparing PDF…' });
    appDialog.toast('DTR PDF downloaded.', { tone: 'success' });
}
</script>
</body>
</html>
