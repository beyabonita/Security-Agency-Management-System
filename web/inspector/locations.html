<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company — Security Agency Management System</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="../js/theme-preference.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/inspector-theme.css" rel="stylesheet">
    <link href="../admin/css/admin-theme.css" rel="stylesheet">
    <style>
        .badge-shift-contract {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: rgba(30, 41, 59, 0.05);
        border: 1px solid rgba(30, 41, 59, 0.15);
        color: #334155;
        border-radius: 6px;
        padding: 2px 7px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: -0.01em;
    }
    [data-theme="dark"] .badge-shift-contract {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.15);
        color: #cbd5e1;
    }
    .loc-address { font-size: 0.82rem; color: var(--ix-muted); line-height: 1.45; max-width: 360px; }
        .loc-coords { font-size: 0.72rem; color: var(--sl-muted); font-family: monospace; margin-top: 4px; }
        .ix-bundles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-bottom: 18px; }
        .ix-bundle-card { border: 1px solid var(--ax-border); border-radius: 12px; background: var(--sl-surface, #fff); overflow: hidden; }
        .ix-bundle-summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; cursor: pointer; background: var(--sl-surface-muted, rgba(15, 23, 42, 0.02)); }
        .ix-bundle-summary::-webkit-details-marker { display: none; }
        .ix-bundle-body { padding: 12px 16px; border-top: 1px solid var(--ax-border); display: grid; gap: 8px; }
        .ix-bundle-guard { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--ax-border); font-size: 0.79rem; }
    </style>
</head>
<body class="admin-body inspector-body" data-ix-page="locations">

<div id="loadingScreen">
    <div class="spinner-border text-success"></div>
    <p>Loading sites…</p>
</div>

<div class="ax-app">
    <aside class="ax-sidebar" id="inspector-navigation">
      <div class="ax-brand"><p class="ax-brand-title">Inspector</p><p class="ax-brand-sub">Security Agency Management System</p></div>
      <nav class="ax-nav" aria-label="Inspector navigation"><div class="ax-nav-label">Manage</div>
        <a href="dashboard.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">dashboard</span> Dashboard</a>
        <a href="users.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">groups</span> My Guards &amp; DTR</a>
        <a href="locations.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">business</span> Company</a>
        <a href="incidents.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">emergency</span> Incidents</a>
        <a href="live-tracking.html"><svg class="ax-nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15M15 6v15"/><circle cx="15" cy="11" r="2" fill="currentColor"/></svg> Guard Tracker</a>
      </nav>
      <div class="ax-sidebar-foot">TwentyTwenty Security Agency</div>
    </aside>
    <div class="ax-main">
      <header class="ax-topbar"><div class="ax-topbar-left">
        <button type="button" class="ax-menu-toggle" id="ixMenuToggle" aria-label="Open navigation"><span class="material-symbols-rounded" aria-hidden="true">menu</span></button>
        <div><div class="ax-breadcrumb">Inspector Console</div><h1 class="ax-page-title">Company</h1></div>
      </div><div class="ax-topbar-right">
        <span class="ax-user-chip" id="ixUserName" hidden aria-live="polite"></span>
        <button type="button" class="ax-btn-logout" onclick="inspectorLogout()">Sign out</button>
      </div></header>
      <main class="ax-content">

            <div class="ix-section-label">Company Deployment Bundles &amp; All Locations</div>
            <div id="inspectorLocationBundles" class="ix-bundles-grid" aria-label="Bundled deployment locations"></div>
            <div class="ix-panel">
              <div class="sl-table-frame">
                <table class="ix-table">
                    <thead>
                        <tr>
                            <th>Label</th>
                            <th>Address</th>
                            <th>Radius</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="locationTable">
                        <tr><td colspan="4" class="empty-state">Loading…</td></tr>
                    </tbody>
                </table>
              </div>
            </div>
        </main>
    </div>
</div>

<script src="../js/auth-username.js"></script>
<script src="js/inspector-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="../js/supabase-firebase-bridge.js"></script>
<script src="../js/platform-configuration.js"></script>
<script src="../js/notification-center.js"></script>

<script>
const auth = firebase.auth();
const db   = firebase.firestore();

auth.onAuthStateChanged(user => {
    if (!user) { window.location.href = "../staff/login.html"; return; }
    db.collection("users").doc(user.uid).get().then(doc => {
        if (!doc.exists) { window.location.href = "../staff/login.html"; return; }
        const role = doc.data().role;
        if (role === "admin") { window.location.href = "../admin/locations.html"; return; }
        if (role !== "inspector") { window.location.href = "../staff/login.html"; return; }
        const d = doc.data();
        const name = [d.firstName, d.middleInitial ? d.middleInitial + "." : "", d.lastName]
            .filter(Boolean).join(" ") || d.name || displayLoginId(d);
        setInspectorUserName(name);
        loadLocations();
        watchInspectorAssignments(loadLocations);
    });
});

function escapeHtml(text) {
    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function loadLocations() {
    return db.collection("locations").orderBy("label").get().then(snapshot => {
        let html = "";
        snapshot.forEach(doc => {
            const d = doc.data();
            const badge = d.active
                ? '<span class="ix-badge ix-badge-ok">Active</span>'
                : '<span class="ix-badge ix-badge-off">Disabled</span>';
            const addressText = d.address
                ? escapeHtml(d.address)
                : (d.latitude != null && d.longitude != null
                    ? `${d.latitude}, ${d.longitude}`
                    : "—");
            const coordsFallback = d.address && d.latitude != null
                ? `<div class="loc-coords">${d.latitude}, ${d.longitude}</div>`
                : "";
            html += `<tr>
                <td>
                    <div class="ix-cell-primary">${escapeHtml(d.label) || '—'}</div>
                    <div class="mt-1">${getShiftModelBadge(d)}</div>
                </td>
                <td><div class="loc-address">${addressText}${coordsFallback}</div></td>
                <td style="color:var(--ix-muted);">${d.radius ? d.radius + ' m' : '—'}</td>
                <td>${badge}</td>
            </tr>`;
        });
        document.getElementById("locationTable").innerHTML = html ||
            `<tr><td colspan="4" class="empty-state">No sites assigned to you or your Guards yet.</td></tr>`;
        renderInspectorBundles(snapshot);
        finishPageLoading();
    }).catch(err => {
        document.getElementById("locationTable").innerHTML =
            `<tr><td colspan="4" class="empty-state" style="color:#dc2626;">Error: ${escapeHtml(err?.message || "Could not load locations.")}</td></tr>`;
        finishPageLoading();
    });
}

async function renderInspectorBundles(locSnapshot) {
    const bundleEl = document.getElementById("inspectorLocationBundles");
    if (!bundleEl) return;
    try {
        const userSnap = await db.collection("users").get();
        const guardsBySite = new Map();
        userSnap.forEach(uDoc => {
            const u = uDoc.data();
            if (u.role !== "user") return;
            const sId = u.assignedLocationId || "";
            if (!sId) return;
            if (!guardsBySite.has(sId)) guardsBySite.set(sId, []);
            guardsBySite.get(sId).push({
                name: [u.firstName, u.middleInitial ? u.middleInitial + "." : "", u.lastName].filter(Boolean).join(" ") || u.name || "Guard",
                phone: u.mobileNumber || u.phone || "",
                active: u.active !== false
            });
        });
        const cards = [];
        locSnapshot.forEach(doc => {
            const d = doc.data();
            const gList = guardsBySite.get(doc.id) || [];
            cards.push(`<details class="ix-bundle-card" open>
                <summary class="ix-bundle-summary">
                    <div>
                        <strong style="font-size:0.9rem;">${escapeHtml(d.label || "Site")}</strong>
                        <div class="loc-address">${escapeHtml(d.address || "—")} · Radius: ${d.radius ? d.radius + " m" : "—"}</div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="ix-badge ${d.active ? "ix-badge-ok" : "ix-badge-off"}">${gList.length} ${gList.length === 1 ? "Guard" : "Guards"}</span>
                    </div>
                </summary>
                <div class="ix-bundle-body">
                    ${gList.length ? gList.map(g => `<div class="ix-bundle-guard"><strong>${escapeHtml(g.name)}</strong><span style="color:var(--ix-muted);font-size:0.74rem;">${escapeHtml(g.phone || (g.active ? "Active" : "Disabled"))}</span></div>`).join("") : `<div style="font-size:0.76rem;color:var(--ix-muted);">No guards currently bundled to this location.</div>`}
                </div>
            </details>`);
        });
        bundleEl.innerHTML = cards.join("");
    } catch (_) {}
}

function formatTime12Hour(time24) {
    if (!time24) return '';
    const parts = String(time24).split(':');
    let h = parseInt(parts[0], 10);
    const m = parts[1] || '00';
    if (isNaN(h)) return time24;
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    if (h === 0) h = 12;
    return `${h}:${m} ${ampm}`;
}

function getShiftModelBadge(d) {
    const model = d.shiftModel || d.shift_model || '2_shifts_12h';
    if (model === '2_shifts_12h') return '<span class="badge-shift-contract"><span class="material-symbols-rounded" style="font-size:12px;" aria-hidden="true">calendar_month</span> 2 Shifts (12h: 6:00 AM–6:00 PM)</span>';
    if (model === '2_shifts_12h_07') return '<span class="badge-shift-contract"><span class="material-symbols-rounded" style="font-size:12px;" aria-hidden="true">calendar_month</span> 2 Shifts (12h: 7:00 AM–7:00 PM)</span>';
    if (model === '3_shifts_8h') return '<span class="badge-shift-contract"><span class="material-symbols-rounded" style="font-size:12px;" aria-hidden="true">calendar_month</span> 3 Shifts (8h: 6:00 AM / 2:00 PM / 10:00 PM)</span>';
    if (model === '1_shift_8h') {
        const customHours = d.customShiftHours || d.custom_shift_hours;
        let timeRange = '8:00 AM–5:00 PM';
        if (Array.isArray(customHours) && customHours.length && customHours[0].start_time && customHours[0].end_time) {
            timeRange = formatTime12Hour(customHours[0].start_time) + '–' + formatTime12Hour(customHours[0].end_time);
        }
        return '<span class="badge-shift-contract"><span class="material-symbols-rounded" style="font-size:12px;" aria-hidden="true">calendar_month</span> 1 Day Shift (' + timeRange + ')</span>';
    }
    if (model === 'custom') {
        const customList = Array.isArray(d.customShiftHours || d.custom_shift_hours) ? (d.customShiftHours || d.custom_shift_hours) : [];
        const customCount = customList.length || 2;
        if (customCount === 1 && customList[0]?.start_time && customList[0]?.end_time) {
            return '<span class="badge-shift-contract"><span class="material-symbols-rounded" style="font-size:12px;" aria-hidden="true">calendar_month</span> 1 Shift (' + formatTime12Hour(customList[0].start_time) + '–' + formatTime12Hour(customList[0].end_time) + ')</span>';
        }
        return '<span class="badge-shift-contract"><span class="material-symbols-rounded" style="font-size:12px;" aria-hidden="true">calendar_month</span> Custom (' + customCount + ' Shifts)</span>';
    }
    return '<span class="badge-shift-contract"><span class="material-symbols-rounded" style="font-size:12px;" aria-hidden="true">calendar_month</span> 2 Shifts (12h)</span>';
}

</script>
</body>
</html>
