<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request history — Inspector</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="../js/theme-preference.js"></script>
  <link href="css/inspector-theme.css" rel="stylesheet">
    <link href="../admin/css/admin-theme.css" rel="stylesheet">
</head>
<body class="admin-body inspector-body" data-ix-page="swaps">
<div id="loadingScreen"><p>Loading Request history…</p></div>
<div class="ax-app">
    <aside class="ax-sidebar" id="inspector-navigation">
      <div class="ax-brand"><p class="ax-brand-title">Inspector</p><p class="ax-brand-sub">Security Agency Management System</p></div>
      <nav class="ax-nav" aria-label="Inspector navigation"><div class="ax-nav-label">Manage</div>
        <a href="dashboard.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">dashboard</span> Dashboard</a>
        <a href="users.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">groups</span> My Guards &amp; DTR</a>
        <a href="locations.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">business</span> Company</a>
        <a href="incidents.html"><span class="ax-nav-icon material-symbols-rounded" aria-hidden="true">emergency</span> Incidents</a>
        <a href="live-tracking.html"><svg class="ax-nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15M15 6v15"/><circle cx="15" cy="11" r="2" fill="currentColor"/></svg> Live guard map</a>
      </nav>
      <div class="ax-sidebar-foot">TwentyTwenty Security Agency</div>
    </aside>
    <div class="ax-main">
      <header class="ax-topbar"><div class="ax-topbar-left">
        <button type="button" class="ax-menu-toggle" id="ixMenuToggle" aria-label="Open navigation"><span class="material-symbols-rounded" aria-hidden="true">menu</span></button>
        <div><div class="ax-breadcrumb">Inspector Console</div><h1 class="ax-page-title">Request history</h1></div>
      </div><div class="ax-topbar-right">
        <span class="ax-user-chip" id="ixUserName" hidden aria-live="polite"></span>
        <button type="button" class="ax-btn-logout" onclick="inspectorLogout()">Sign out</button>
      </div></header>
      <main class="ax-content"><div class="ix-section-label">Previous requests</div><section class="ix-panel"><div id="requests" class="ix-link-list"><div class="empty-state">Loading requests…</div></div></section></main>
  </div>
</div>
<script src="../js/app-dialogs.js"></script>
<script src="js/inspector-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="../js/supabase-firebase-bridge.js"></script>
<script src="../js/platform-configuration.js"></script>
<script src="../js/notification-center.js"></script>
<script>
const auth=firebase.auth(),db=firebase.firestore();let me;
auth.onAuthStateChanged(async user=>{if(!user){location.href='../staff/login.html';return}me=user;const profile=await db.collection('users').doc(user.uid).get();if(!profile.exists||profile.data().role!=='inspector'){location.href='../staff/login.html';return}setInspectorUserName([profile.data().firstName,profile.data().lastName].filter(Boolean).join(' ')||'Inspector');finishPageLoading();load();});
function profileName(profile, fallback) {
  if (!profile) return fallback || 'Unassigned';
  return [profile.first_name, profile.middle_initial ? `${profile.middle_initial}.` : '', profile.last_name]
    .filter(Boolean).join(' ') || profile.username || fallback || 'Guard';
}
function formatDutyRange(startAt, endAt) {
  if (!startAt || !endAt) return 'No change requested';
  const start = new Date(startAt), end = new Date(endAt);
  if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 'Invalid duty time';
  return `${start.toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })} – ${end.toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`;
}
async function load(){
  const el=document.getElementById('requests');
  const [requestResult, profileResult, scheduleResult] = await Promise.all([
    appSupabase.from('shift_swap_requests').select().eq('inspector_id',me.uid).order('created_at',{ascending:false}),
    appSupabase.from('profiles').select('id,first_name,middle_initial,last_name,username'),
    appSupabase.from('schedules').select('id,start_at,end_at,location_label'),
  ]);
  const error=requestResult.error||profileResult.error||scheduleResult.error;
  if(error){el.innerHTML='<div class="empty-state">Could not load requests.</div>';appDialog.toast(error.message,{tone:'danger'});return}
  const requests=requestResult.data||[];
  if(!requests.length){el.innerHTML='<div class="empty-state">Requests now go directly to Operations Head. No previous requests to show.</div>';return}
  const profiles=Object.fromEntries((profileResult.data||[]).map(profile=>[profile.id,profile]));
  const schedules=Object.fromEntries((scheduleResult.data||[]).map(schedule=>[schedule.id,schedule]));
  el.innerHTML=requests.map(item=>{
    const schedule=schedules[item.requested_schedule_id]||{};
    const guard=profileName(profiles[item.requester_id],'Guard');
    const target=item.target_guard_id ? profileName(profiles[item.target_guard_id],'Proposed guard') : guard;
    const currentDuty=formatDutyRange(schedule.start_at,schedule.end_at);
    const requestedDuty=item.requested_start_at||item.requested_end_at ? formatDutyRange(item.requested_start_at,item.requested_end_at) : currentDuty;
    return `<article class="ix-link-row"><div class="ix-link-row-left"><div class="ix-link-row-icon material-symbols-rounded" aria-hidden="true">swap_horiz</div><div><div class="ix-link-row-title">${escapeText(guard)} — shift change request</div><div class="ix-link-row-desc">${escapeText(item.reason||'No reason provided')}</div><div class="ix-cell-secondary">Current: ${escapeText(currentDuty)}${schedule.location_label ? ` · ${escapeText(schedule.location_label)}` : ''}</div><div class="ix-cell-secondary">Requested: ${escapeText(requestedDuty)} · Coverage: ${escapeText(target)}</div></div></div><div class="ix-cell-secondary">${escapeText(item.status)}</div></article>`;
  }).join('');
}
function escapeText(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));}
</script>
</body>
</html>
