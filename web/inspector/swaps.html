<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shift Requests — Inspector</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="css/inspector-theme.css" rel="stylesheet">
</head>
<body class="inspector-body" data-ix-page="swaps">
<div id="loadingScreen"><p>Loading shift requests…</p></div>
<div class="ix-app">
  <header class="ix-shell">
    <div class="ix-shell-bar"><div class="ix-shell-brand"><span class="ix-brand-badge">Field audit</span><div class="ix-shell-titles"><p class="ix-shell-product">Sentinel Link</p><p class="ix-shell-tagline">Guard monitoring and field review</p></div></div><div class="ix-shell-actions"><span class="ix-readonly-pill">Inspector</span><span class="ix-user-chip" id="ixUserName">Inspector</span><button class="ix-btn-logout" onclick="inspectorLogout()">Sign out</button></div></div>
    <nav class="ix-topnav" id="ixTopnav"><button class="ix-menu-toggle" id="ixMenuToggle">☰ Menu</button><div class="ix-topnav-links"><a href="dashboard.html">📊 Overview</a><a href="users.html">📋 Guard DTR</a><a href="locations.html">📍 Sites</a><a href="incidents.html">🚨 Alerts</a><a href="swaps.html">🔁 Shift requests</a></div></nav>
  </header>
  <div class="ix-main">
    <div class="ix-page-head"><p class="ix-breadcrumb">Inspector Portal</p><h1 class="ix-page-title">Shift Requests</h1></div>
    <main class="ix-content"><div class="ix-section-label">Awaiting review</div><section class="ix-panel"><div id="requests" class="ix-link-list"><div class="empty-state">Loading requests…</div></div></section></main>
  </div>
</div>
<script src="../js/app-dialogs.js"></script>
<script src="js/inspector-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="../js/supabase-firebase-bridge.js"></script>
<script src="../js/notification-center.js"></script>
<script>
const auth=firebase.auth(),db=firebase.firestore();let me;
auth.onAuthStateChanged(async user=>{if(!user){location.href='login.html';return}me=user;const profile=await db.collection('users').doc(user.uid).get();if(!profile.exists||profile.data().role!=='inspector'){location.href='login.html';return}setInspectorUserName([profile.data().firstName,profile.data().lastName].filter(Boolean).join(' ')||'Inspector');finishPageLoading();load();});
function profileName(profile, fallback) {
  if (!profile) return fallback || 'Unassigned';
  return [profile.first_name, profile.middle_initial ? `${profile.middle_initial}.` : '', profile.last_name]
    .filter(Boolean).join(' ') || profile.username || fallback || 'Guard';
}
function formatDutyRange(startAt, endAt) {
  if (!startAt || !endAt) return 'No change requested';
  const start = new Date(startAt), end = new Date(endAt);
  if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 'Invalid duty time';
  return `${start.toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })} – ${end.toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`;
}
async function load(){
  const el=document.getElementById('requests');
  const [requestResult, profileResult, scheduleResult] = await Promise.all([
    appSupabase.from('shift_swap_requests').select().eq('inspector_id',me.uid).eq('status','pending_inspector').order('created_at',{ascending:false}),
    appSupabase.from('profiles').select('id,first_name,middle_initial,last_name,username'),
    appSupabase.from('schedules').select('id,start_at,end_at,location_label'),
  ]);
  const error=requestResult.error||profileResult.error||scheduleResult.error;
  if(error){el.innerHTML='<div class="empty-state">Could not load requests.</div>';appDialog.toast(error.message,{tone:'danger'});return}
  const requests=requestResult.data||[];
  if(!requests.length){el.innerHTML='<div class="empty-state">No shift-change requests are waiting for your review.</div>';return}
  const profiles=Object.fromEntries((profileResult.data||[]).map(profile=>[profile.id,profile]));
  const schedules=Object.fromEntries((scheduleResult.data||[]).map(schedule=>[schedule.id,schedule]));
  el.innerHTML=requests.map(item=>{
    const schedule=schedules[item.requested_schedule_id]||{};
    const guard=profileName(profiles[item.requester_id],'Guard');
    const target=item.target_guard_id ? profileName(profiles[item.target_guard_id],'Proposed guard') : guard;
    const currentDuty=formatDutyRange(schedule.start_at,schedule.end_at);
    const requestedDuty=item.requested_start_at||item.requested_end_at ? formatDutyRange(item.requested_start_at,item.requested_end_at) : currentDuty;
    return `<article class="ix-link-row"><div class="ix-link-row-left"><div class="ix-link-row-icon">🔁</div><div><div class="ix-link-row-title">${escapeText(guard)} — shift change request</div><div class="ix-link-row-desc">${escapeText(item.reason||'No reason provided')}</div><div class="ix-cell-secondary">Current: ${escapeText(currentDuty)}${schedule.location_label ? ` · ${escapeText(schedule.location_label)}` : ''}</div><div class="ix-cell-secondary">Requested: ${escapeText(requestedDuty)} · Coverage: ${escapeText(target)}</div></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="action-btn btn-enable" onclick="decide('${item.id}',true,this)">Recommend</button><button class="action-btn btn-disable" onclick="decide('${item.id}',false,this)">Reject</button></div></article>`;
  }).join('');
}
function escapeText(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));}
async function decide(id, ok, button) {
  const values = await appDialog.form({title:ok?'Recommend approval':'Reject shift request',message:ok?'Add a review note before routing this request to HR / Operations.':'Explain why the request should not proceed.',confirmText:ok?'Send recommendation':'Reject request',danger:!ok,fields:[{name:'note',label:'Review note',type:'textarea',placeholder:'Optional review note'}]});
  if (!values) return;
  try {
    await appDialog.runBusy(button, async () => {
      const result = await appSupabase.rpc('review_shift_swap_by_inspector',{p_request_id:id,p_approve:ok,p_note:values.note.trim()});
      if (result.error) throw result.error;
      await load();
    }, { label: ok ? 'Sending…' : 'Rejecting…' });
    appDialog.toast(ok?'Recommendation sent.':'Request rejected.',{tone:'success'});
  } catch (error) {
    appDialog.toast(error.message || 'Could not update the shift request.', {tone:'danger'});
  }
}
</script>
</body>
</html>
