name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Keystore for Release
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore -alias sentinellink -keyalg RSA -keysize 2048 -validity 10000 -storepass sentinellink123 -keypass sentinellink123 -dname "CN=SentinelLink, OU=Security, O=Agency, L=City, S=State, C=PH"
          cat << 'EOF' > android/signing.properties
          storePassword=sentinellink123
          keyPassword=sentinellink123
          keyAlias=sentinellink
          storeFile=app/release.keystore
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK outputs
        run: |
          mkdir -p web/downloads
          cp build/app/outputs/flutter-apk/app-release.apk web/downloads/security-agency-management-system-guard.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Security-Agency-Management-System-Guard-v1.0.21.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guard-mobile-app-v1.0.21
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/Security-Agency-Management-System-Guard-v1.0.21.apk
            build/app/outputs/flutter-apk/app-release.apk
          name: Guard Mobile App Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Security Agency Management System — Guard Mobile App ${{ github.ref_name }}

            ### Direct Download:
            Download the signed Android APK directly:
            - **[Download Security-Agency-Management-System-Guard-v1.0.21.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Security-Agency-Management-System-Guard-v1.0.21.apk)**

            ### Features & Enhancements in this Build:
            - **Device Cellular/Hardware ID Verification**: Strict hardware binding against registered profile preventing multi-device spoofing.
            - **Geotagged & Timestamp Watermark Banner**: Real-time Philippine Time (PHT) + GPS coordinate stamp on evidence and front camera captures.
            - **Live Front-Camera Selfie Face Verification**: In-app selfie verification sheet with embedded GPS stamp before Time In.
            - **Dual-Point Proximity Distance**: Live geofence distance calculation.
            - **Force Attendance Workflow**: Reason dialog and pending authorization queue when outside post boundary.
            - **Absence, Shift Swap & Overtime**: 3-way segmented duty request classification.
            - **Realtime Roster & Duty Synchronization**: Instant shift status alignment with Supabase database.

      - name: Commit updated APK to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main
          git pull origin main --rebase || true
          cp build/app/outputs/flutter-apk/app-release.apk web/downloads/security-agency-management-system-guard.apk
          git add web/downloads/security-agency-management-system-guard.apk
          git commit -m "chore(mobile): update Guard release APK to ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push to main branch skipped"
